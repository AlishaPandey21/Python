<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
initial-scale=1.0">
<head>
<title>Add New Course</title>
</head>
<style>


.container{
width: 500px;
margin: 50px auto;
background-color: white;
padding: 40px;
border: 1px solid #ccc;
border-radius: 5px;
}
h1{
text-align: center;
color: #333;
}
input,
textarea,
select{
width: 100%;
padding: 8px;
margin-top: 5px;
margin-bottom: 10px;
border: 1px solid #ccc;
border-radius: 4px;
}
button{
background-color: green;
color: white;
padding: 10px 15px;
border: none;
border-radius: 4px;
cursor: pointer;
}
button:hover{
background-color: darkgreen;
}
a{
text-decoration: none;



color: azure;
}
</style>
<body>
<div class="container">
<h1>Add Course</h1>
<form method="POST">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Add Course</button>
<button><a href="/">Back</a></button>
</form>
</div>
</body>
</html>
