<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
initial-scale=1.0">
<title>view course</title>
<style>
.box{
width: 500px;
margin: 50px;
padding: 20px;
border: 2px solid black;

background-color: white;
}
h1{
text-align: center;
}
h4{
padding: 8px;
border-bottom: 1px solid gray;
}
button{
background-color: green;
color: white;
padding: 10px 15px;
border: none;
border-radius: 4px;
cursor: pointer;
}
button:hover{
background-color: darkgreen;
}
a{
text-decoration: none;
color: azure;
}
</style>
</head>
<body>
<div class="box">
<h1>Course Details</h1>
<h4>Course Name : {{ Course.course_name }}</h4>
<h4>Course Code : {{ Course.course_code }}</h4>
<h4>Description : {{ Course.description }}</h4>
<h4>Instructor : {{ Course.instructor }}</h4>
<h4>Duration : {{ Course.duration }}</h4>
<h4>Credits : {{ Course.credit }}</h4>
<button><a href="/">Back</a></button>


</div>
</body>
</html>
