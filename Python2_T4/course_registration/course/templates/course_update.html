<!DOCTYPE html>
<html>
<head>
<title>Update Course</title>
<style>
.container{
width: 500px;
margin: 50px 20px;
background-color: white;
padding: 40px;
border: 1px solid #ccc;
border-radius: 5px;
}
h1{
text-align: center;
color: #333;
}
input,
textarea,
select{
width: 100%;
padding: 8px;
margin-top: 5px;
margin-bottom: 10px;
border: 1px solid #ccc;
border-radius: 4px;
}
button{
background-color: green;
color: white;
padding: 10px 15px;
border: none;
border-radius: 4px;
cursor: pointer;
}


button:hover{
background-color: darkgreen;
}
a{
text-decoration: none;
color: azure;
}
</style>
</head>
<body>
<div class="container">
<h1>Update Course</h1>
<form method="POST">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Update Course</button>
<button><a href="/">Back</a></button>
</form>
</div>
</body>
</html>
