{% extends "vehicleapp/base.html" %}
{% block content %}
<h2>Contact Form</h2>
<form method="POST">
    {% csrf_token %}
    <label>Name</label>
    <input type="text" name='name'>
    <button type="submit">Submit</button>
</form>
{% if message %}
<h3>Hello {{ message }}</h3>
{% endif %}
{% endblock  %}
